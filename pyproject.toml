[project]
name = "rmbench"
version = "0.1.0"
description = "RMBench: Memory-Dependent Robotic Manipulation Benchmark"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transforms3d==0.4.2",
    "sapien==3.0.0b1",
    "scipy==1.10.1",
    "mplib==0.2.1",
    "gymnasium==0.29.1",
    "trimesh==4.4.3",
    "open3d==0.18.0",
    "imageio==2.34.2",
    "pydantic",
    "zarr",
    "openai",
    "huggingface_hub==0.25.0",
    "h5py",
    # For Description Generation
    "azure==4.0.0",
    "azure-ai-inference",
    "pyglet<2",
    "wandb",
    "moviepy",
    "termcolor",
    "av",
    "matplotlib",
    "ffmpeg",
    # sapien 3.0.0b1 imports pkg_resources at runtime; setuptools >=81 dropped it.
    "setuptools<81",
    # ---- OpenPI remote inference client ----
    # The RMBench eval driver talks to an external model served with the openpi
    # websocket protocol (eva-vla deploy/serve.py). openpi-client is a tiny
    # pure-python package (WebsocketClientPolicy + msgpack_numpy + image_tools)
    # that speaks the same msgpack-numpy wire format as the server. Mirrors the
    # calvin eval_tests setup.
    "openpi-client",
    "websockets",
    "msgpack",
    "pillow",
    # curobo 0.7.8 uses the legacy `wp.torch` interop, which warp-lang >=1.12
    # dropped (modules moved under _src/). Pin to the last version that exposes it.
    "warp-lang==1.11.0",
    # Compiled-from-source deps (see [tool.uv.sources] below).
    "pytorch3d",
    "nvidia-curobo",
]

[project.urls]
Homepage = "https://rmbench.github.io/"
Repository = "https://github.com/RoboTwin-Platform/RMBench"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The repo root is script-driven, not an importable package. Install its
# dependencies without bundling the top-level dirs (data/, envs/, policy/, ...).
[tool.setuptools]
py-modules = []

# ---------------------------------------------------------------------------
# uv configuration: `uv sync` installs everything, including the two
# compiled-from-source packages (pytorch3d @ git stable, curobo @ git v0.7.8).
# ---------------------------------------------------------------------------
[tool.uv.sources]
# torch/torchvision come from the CUDA 12.1 wheel index (matches +cu121 build).
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
# pytorch3d is built from the pinned "stable" branch, matching script/_install.sh.
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "stable" }
# curobo is built from tag v0.7.8; its distribution name is nvidia-curobo.
# Pulled and compiled directly by `uv sync` (no manual git clone needed).
nvidia-curobo = { git = "https://github.com/NVlabs/curobo.git", tag = "v0.7.8" }
# openpi-client: pure-python websocket client for the openpi inference protocol.
# Installed from the packages/openpi-client subdirectory of the openpi repo,
# matching the calvin eval_tests configuration.
openpi-client = { git = "https://github.com/Physical-Intelligence/openpi.git", subdirectory = "packages/openpi-client" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
# pytorch3d and curobo compile CUDA extensions against the already-installed
# torch, so they must be built without an isolated build environment.
no-build-isolation-package = ["pytorch3d", "nvidia-curobo"]

# pytorch3d ships no static metadata, so uv would try to BUILD it just to read
# its dependencies during locking — before torch is installed — which fails with
# "No module named 'torch'". Declaring the metadata here (values taken verbatim
# from each project's setup.py / setup.cfg) lets uv resolve without that build;
# the actual compile happens later, once torch is already in the env.
[[tool.uv.dependency-metadata]]
name = "pytorch3d"
version = "0.7.8"
requires-dist = ["iopath"]

[[tool.uv.dependency-metadata]]
name = "nvidia-curobo"
version = "0.7.8"
requires-dist = [
    "pybind11",
    "networkx",
    "numpy",
    "numpy-quaternion",
    "pyyaml",
    "setuptools-scm>=6.2",
    "torch>=1.10",
    "trimesh",
    "yourdfpy>=0.0.53",
    "warp-lang>=0.9.0",
    "scipy>=1.7.0",
    "tqdm",
    "wheel",
    "importlib_resources",
    "scikit-image",
]

# Neither pytorch3d nor curobo declares its build tools (setuptools) or torch in
# build metadata — pytorch3d's only runtime dep is iopath — so under
# no-build-isolation uv has no signal to install them before the compile, which
# is why a bare build failed with "No module named 'setuptools'". These entries
# create that ordering edge: uv installs them into the project env first, then
# builds. torch==2.4.1 matches the resolved 2.4.1+cu121 wheel (== ignores the
# local +cu121 tag), so no CPU-torch is pulled and the compiled .so's ABI lines up.
[tool.uv.extra-build-dependencies]
pytorch3d = [
    "torch==2.4.1",
    "setuptools==82.0.1",
    "wheel",
    "numpy<2",
    "ninja",
]
nvidia-curobo = [
    "torch==2.4.1",
    "setuptools==82.0.1",
    "wheel",
    "setuptools-scm[toml]>=6.2",
    "numpy<2",
    "ninja",
]

# Build-time env for the CUDA compile. FORCE_CUDA=1 stops pytorch3d silently
# building a CPU-only extension if no GPU is visible during the build; the arch
# list targets A800 (8.0, dev hosts) and H200 (9.0, cluster) so the compiled
# kernels run on both.
[tool.uv.extra-build-variables]
pytorch3d = { FORCE_CUDA = "1", TORCH_CUDA_ARCH_LIST = "8.0;9.0" }
nvidia-curobo = { TORCH_CUDA_ARCH_LIST = "8.0;9.0" }
